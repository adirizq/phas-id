[project]
name = "emlp"
version = "0.1.0"
description = "EMNLP Paper Project - Personalized AI Detection"
readme = "README.md"
requires-python = "==3.11.12"
dependencies = [
    "cefrpy==1.0.1",
    "datasets==3.1.0",
    "httpx==0.27.2",
    "joblib==1.4.2",
    "lexicalrichness==0.5.1",
    "lightning>=2.5",
    "modelscope==1.20.1",
    "mosec==0.9.0",
    "msgpack-python==0.5.6",
    "nltk==3.9.1",
    "numpy==2.1.3",
    "nvitop==1.5.0",
    "openai==1.55.1",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "protobuf==5.29.1",
    "py-readability-metrics==1.4.5",
    "python-dotenv==1.1.0",
    "scikit-learn==1.5.2",
    "scipy==1.14.1",
    "sentencepiece==0.2.0",
    "spacy==3.8.3",
    "torch>=2.6",
    "tqdm==4.67.0",
    "transformers>=4.48.0",
    "wandb[media]==0.19.0",
    "accelerate>=1.6.0",
    "bitsandbytes>=0.45.5",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "seaborn>=0.13.2",
    "latex>=0.7.0",
    "tiktoken>=0.12.0",
    "sentence-transformers>=5.2.0",
    "umap-learn>=0.5.7",
    "faiss-gpu-cu12>=1.13.2",
    "rich>=12.0.0",
    "h5py>=3.15.1",
    "xgboost>=3.1.3",
    "pydantic>=2.12.5",
    "levenshtein>=0.27.3",
    "pytorch-crf>=0.7.2",
    "peft>=0.11.0",
    "optuna>=4.7.0",
    "optuna-integration[pytorch-lightning]>=4.7.0",
    "optuna-dashboard>=0.20.0",
    "flash-attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.6cxx11abiFALSE-cp311-cp311-linux_x86_64.whl",
]

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.uv]
no-build-package = ["flash-attn"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.ruff]
line-length = 1000

[tool.basedpyright]
typeCheckingMode = "basic"
reportPrivateImportUsage = false
